<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Haunted House Builder (player)</title>
<link rel="icon" href="data:,">
<!-- This page is what X loads inside the post. Keep it out of Google: -->
<meta name="robots" content="noindex">
<style>
  /* touch-action:none + overflow:hidden only affect OUR page inside the frame: no pinch-zoom, no rubber-band, no scroll */
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070a;
            touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}

  #loading .dot{width:12px;height:12px;margin-top:12px;background:#e0242a;animation:b .5s infinite alternate}
  @keyframes b{to{transform:translateY(-12px)}}
  #loading.off{display:none}
  /* corner buttons: top corners (X can cover the bottom 30% on phones), at least 44x44 px */
  .ctl{position:fixed;top:2px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;
       border:0;border-radius:10px;background:rgba(18,10,20,.55);color:#fff;font:20px system-ui,sans-serif;
       text-decoration:none;cursor:pointer;padding:0;z-index:5;-webkit-tap-highlight-color:transparent}
  #mute{right:2px}
  #open{left:2px;display:none}
  html.framed #open{display:flex}
  html.card #open,html.card #mute{display:none}
</style>
</head>

const b = ST.btns.find(q => ["film", "act", "door", "tohouse", "walk"].includes(q.id)); if (b) { ST.press(b.id); return true; }
return false;
},
song(scene) {
if (scene === "title") return "title"; if (scene === "over") return "over";
return ph === "build" ? "build" : ph === "walk" || ph === "card" ? "walk" : "night";
},
over() {
const h = lastHouse || myHouse(), r = rating(h), code = encode(h), sc = WK ? WK.scares : 0;
try { ST.brag.link = () => location.href.split("#")[0].split("?")[0].replace(/game(\.test)?\.html$/, "") + "?v=" + ST.cfg.v + "#h=" + code; } catch (e) {}
return { win: true, title: "TAPE ENDS", lines: [houseName(h) + ": SCARE RATING " + r.n + " (" + r.rank + ")", "YOU SURVIVED " + sc + " HAUNT" + (sc === 1 ? "" : "S") + ". HOUSE CODE " + code],
brag: "My house scored " + r.n + " (" + r.rank.toLowerCase() + "). House code " + code + ". Walk it if you dare." };
},
hook: () => ({
player: { x: +cam.x.toFixed(1), y: +cam.y.toFixed(1) }, phase: ph, mode, left: N && ph === "night" ? +N.bat.toFixed(2) : WK ? WK.i : 0, hp: 1,
cash: D().cash, rooms: D().rooms.slice(), haunts: D().haunts.slice(), camView: { vw: Math.round(VS.vw), vh: Math.round(VS.vh) },
night: N ? { n: N.n, unrest: +N.unrest.toFixed(1), bat: +N.bat.toFixed(1), got: N.got.slice(), tune: N.tune ? { f: +N.tune.f.toFixed(1), T: +N.tune.T.toFixed(1), hold: +N.tune.hold.toFixed(2) } : null,
spirit: N.spirit ? { id: N.spirit.id, x: Math.round(N.spirit.x), a: +N.spirit.a.toFixed(2) } : null, film: !!N.film, died: N.died,
hots: N.hots.map(h => ({ x: h.x, kind: h.kind, done: !!h.done, depth: h.depth || 0, prog: h.prog || 0 })) } : null,
walk: WK ? { i: WK.i, rooms: WK.plan.seq.slice(), scares: WK.scares, total: WK.total, playing: WK.play ? HAUNTS[WK.play.h].k : null, exit: WK.exit,
placed: WK.plan.slots.map(s => s.map(e => ({ h: e.h, trig: e.trig, spot: e.spot, state: e.state }))) } : null,
code: encode(lastHouse || myHouse()), visit: visit ? encode(visit) : null, fx: { face: FX.face > 0, glitch: FX.glitch > 0 },
}),
};
ST.run(GAME);
</script>
</body>
</html>
