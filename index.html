<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<title>Haunted House Builder - a Splazetown game you can play inside an X post</title>

<!-- ===== X (Twitter) PLAYER CARD =====
     X reads these tags when someone posts a link to THIS page (post this page, never game.html).
     All links point to the live address https://splazepine.github.io/haunted-house-builder-play/
     They must be full https:// links, because X does not run JavaScript.
     publish.py also bumps the version number on EVERY link at once (X and browsers cache). -->
<meta name="twitter:card" content="player">
<meta name="twitter:title" content="Haunted House Builder">
<meta name="twitter:description" content="Earn cash in a graveyard at night, build a haunted house, then survive it through a camcorder. Play it right here in the post.">
<meta name="twitter:image" content="https://splazepine.github.io/haunted-house-builder-play/card.png?v=1">
<meta name="twitter:image:alt" content="Found-footage title screen of Haunted House Builder: an abandoned house at night behind an open gate">
<meta name="twitter:player" content="https://splazepine.github.io/haunted-house-builder-play/game.html?v=1">
<meta name="twitter:player:width" content="480">
<meta name="twitter:player:height" content="480">

<!-- Open Graph tags: other apps (Discord, iMessage, etc.) read these -->
<meta property="og:type" content="website">
<meta property="og:title" content="Haunted House Builder">
<meta property="og:description" content="Earn cash in a graveyard at night, build a haunted house, then survive it through a camcorder.">
<meta property="og:image" content="https://splazepine.github.io/haunted-house-builder-play/card.png?v=1">
<meta property="og:url" content="https://splazepine.github.io/haunted-house-builder-play/?v=1">

<style>
  html,body{margin:0;height:100%;background:#05070a;color:#e4eaf0;font:16px system-ui,sans-serif}
  main{max-width:520px;margin:0 auto;padding:24px 16px;text-align:center}
  h1{color:#d6dee6;letter-spacing:.04em}
  .frame{width:100%;max-width:480px;aspect-ratio:1;border:0;border-radius:12px;background:#000}
</style>
</head>
<body>
<main>
  <h1>Haunted House Builder</h1>
  <p>Earn cash in a graveyard at night, build a haunted house, then survive it through a camcorder.</p>
  <!-- People who open the link in a normal browser still get to play. -->
  <iframe class="frame" src="game.html?v=1" title="Haunted House Builder game"
          sandbox="allow-popups allow-same-origin allow-scripts allow-presentation"></iframe>
  <p><a id="full" href="game.html?v=1" target="_blank" rel="noopener" style="color:#a8d0dc">Open full screen ↗</a></p>
  <p style="font-size:13px;opacity:.7">Contains jump scares (no gore). A shared link with a House Code opens a friend's house.</p>
</main>
<script>
  // A House Code rides in the link's #hash (e.g. #h=31324-AACHJ): hand it to the game. No server, nothing sent anywhere.
  (function () { var h = location.hash; if (!/^#h=[0-9A-Za-z-]{2,24}$/.test(h)) return;
    var f = document.querySelector("iframe.frame"), a = document.getElementById("full");
    f.src = f.getAttribute("src") + h; a.href = a.getAttribute("href") + h; })();
</script>
</body>
</html>
